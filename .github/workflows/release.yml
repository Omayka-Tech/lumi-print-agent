name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: print-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python-version: "3.8"
            artifact_os: windows
            artifact_arch: x86_64
          - os: macos-latest
            python-version: "3.12"
            artifact_os: macos
            artifact_arch: arm64
          - os: ubuntu-22.04
            python-version: "3.12"
            artifact_os: linux
            artifact_arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync version from tag
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/sync-version.sh packaging/package-artifact.sh
          ./packaging/sync-version.sh "${GITHUB_REF_NAME}"

      - name: Install package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[gui,packaging]"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-win7.ps1

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/build-macos.sh
          # build-macos.sh reinstalls; PyInstaller already available from previous step
          python -m PyInstaller --noconfirm --clean packaging/lumi-print-agent.spec

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean packaging/lumi-print-agent.spec

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/package-artifact.sh "${{ matrix.artifact_os }}" "${{ matrix.artifact_arch }}" "${GITHUB_WORKSPACE}/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiPrintAgent-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}
          path: |
            dist/LumiPrintAgent-*.zip
            dist/LumiPrintAgent-*.tar.gz
            dist/LumiPrintAgent-*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Meta
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS
          # Prefer merged .sha256 fragments; recompute if missing.
          shopt -s nullglob
          for f in LumiPrintAgent-*.zip LumiPrintAgent-*.tar.gz; do
            if [[ -f "${f}.sha256" ]]; then
              cat "${f}.sha256" >> SHA256SUMS
            else
              sha256sum "${f}" >> SHA256SUMS
            fi
          done
          rm -f LumiPrintAgent-*.sha256
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Lumi Print Agent ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/LumiPrintAgent-*.zip
            release-assets/LumiPrintAgent-*.tar.gz
            release-assets/SHA256SUMS

  publish-downloads:
    needs: release
    runs-on: [self-hosted, linux, lumi]
    timeout-minutes: 20
    steps:
      - name: Guard — runner must not be root
        run: |
          set -euo pipefail
          echo "runner_user=$(id -un) uid=$(id -u)"
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::Self-hosted runner is root. Fix systemd User= before publishing downloads."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Mirror release to downloads tree
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          DEST_ROOT: /opt/lumi/subprojects/downloads/printer-agent
        run: |
          set -euo pipefail
          chmod +x packaging/generate-downloads-index.sh

          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT

          if command -v gh >/dev/null 2>&1; then
            gh release download "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "${TMP}"
          else
            python3 packaging/download-release-assets.py \
              "${GITHUB_REPOSITORY}" "${TAG}" "${TMP}"
          fi

          VER_DIR="${DEST_ROOT}/${TAG}"
          LATEST_DIR="${DEST_ROOT}/latest"
          mkdir -p "${VER_DIR}" "${LATEST_DIR}"

          # Only release assets (zips/tarballs/checksums), no hidden junk.
          find "${TMP}" -maxdepth 1 -type f ! -name '.*' -print0 \
            | xargs -0 -I{} cp -f {} "${VER_DIR}/"

          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete "${VER_DIR}/" "${LATEST_DIR}/"
          else
            rm -rf "${LATEST_DIR}"
            mkdir -p "${LATEST_DIR}"
            cp -a "${VER_DIR}/." "${LATEST_DIR}/"
          fi

          # Permissions: readable by nginx, writable by runner owner.
          find "${DEST_ROOT}" -type d -exec chmod 755 {} +
          find "${DEST_ROOT}" -type f -exec chmod 644 {} +

          ./packaging/generate-downloads-index.sh "${DEST_ROOT}"

          echo "Published ${TAG} → ${VER_DIR} and ${LATEST_DIR}"
          ls -la "${VER_DIR}"
          ls -la "${LATEST_DIR}"
