# Document root = printer-agent tree only (bind-mounted).
# autoindex off: curated index.html from the release mirror job.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # Deny dotfiles / VCS metadata.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
